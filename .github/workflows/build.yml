name: Build iOS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SDL_VERSION: 2.32.10
  # upstream sources, pinned so builds are reproducible
  XASH3D_REF: d6b54aaf6c1d8518e08404a842f3f6ee02cef3cc   # FWGS/xash3d-fwgs master, 2026-10-21
  CS16_REF: e0da56ebd3d27c2a06538ac34b025b1dd7de4ccb     # Velaron/cs16-client main, 2026-10-18

jobs:
  ipa:
    name: IPA (${{ matrix.runner }})
    # Built on GitHub's Intel Macs: the Apple Silicon runners were often out of capacity
    # and never picked jobs up. Intel cross-compiles the arm64 iPhone build fine. When
    # GitHub retires the Intel images, change this to macos-latest (the scripts handle both).
    strategy:
      fail-fast: false
      matrix:
        runner: [ macos-15-intel ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Fetch Xash3D FWGS
        uses: actions/checkout@v6
        with:
          repository: FWGS/xash3d-fwgs
          ref: ${{ env.XASH3D_REF }}
          path: xash3d-fwgs
          submodules: recursive

      - name: Fetch cs16-client
        uses: actions/checkout@v6
        with:
          repository: Velaron/cs16-client
          ref: ${{ env.CS16_REF }}
          path: cs16-client
          submodules: recursive

      # SDL is cached as soon as it's built, so a later failing step doesn't throw it away
      - name: Restore SDL2
        id: sdl-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/SDL2.xcframework
          key: sdl2-xcframework-${{ env.SDL_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build SDL2
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: bash scripts/build.sh sdl

      - name: Save SDL2
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: deps/SDL2.xcframework
          key: ${{ steps.sdl-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p ci-files
          bash scripts/build.sh device 2>&1 | tee ci-files/build-device.log

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: CS16-iOS-ipa-${{ matrix.runner }}
          path: out/device/CS16-iOS.ipa
          if-no-files-found: error

      - name: Publish logs to the ci-logs branch
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-files
          cp out/device/CS16-iOS.ipa ci-files/ 2>/dev/null || true
          bash scripts/publish_ci_logs.sh device-${{ matrix.runner }} ci-files

  simulator:
    name: Simulator test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ macos-15-intel ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Fetch Xash3D FWGS
        uses: actions/checkout@v6
        with:
          repository: FWGS/xash3d-fwgs
          ref: ${{ env.XASH3D_REF }}
          path: xash3d-fwgs
          submodules: recursive

      - name: Fetch cs16-client
        uses: actions/checkout@v6
        with:
          repository: Velaron/cs16-client
          ref: ${{ env.CS16_REF }}
          path: cs16-client
          submodules: recursive

      # SDL is cached as soon as it's built, so a later failing step doesn't throw it away
      - name: Restore SDL2
        id: sdl-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/SDL2.xcframework
          key: sdl2-xcframework-${{ env.SDL_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build SDL2
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: bash scripts/build.sh sdl

      - name: Save SDL2
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: deps/SDL2.xcframework
          key: ${{ steps.sdl-cache.outputs.cache-primary-key }}

      - name: Build for the simulator
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p ci-files
          bash scripts/build.sh simulator 2>&1 | tee ci-files/build-simulator.log

      - name: Run in the simulator
        shell: bash
        run: bash scripts/sim_test.sh 2>&1 | tee ci-files/sim-test.log

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-test-${{ matrix.runner }}
          path: out/sim-test
          if-no-files-found: warn

      - name: Publish logs to the ci-logs branch
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-files
          cp -R out/sim-test ci-files/ 2>/dev/null || true
          bash scripts/publish_ci_logs.sh simulator-${{ matrix.runner }} ci-files

  release:
    name: Publish release
    needs: ipa
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Upload the IPA to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for runner in macos-latest macos-15-intel; do
            if gh run download "${{ github.run_id }}" -R "$REPO" -n "CS16-iOS-ipa-$runner" -D dist; then
              echo "using the IPA built on $runner"
              break
            fi
          done
          test -f dist/CS16-iOS.ipa || { echo "no IPA was built"; exit 1; }
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            TITLE="CS 1.6 for iOS ${{ github.ref_name }}"
          else
            TAG=latest
            TITLE="CS 1.6 for iOS (build ${{ github.run_number }})"
            gh release delete latest -R "$REPO" --cleanup-tag -y || true
          fi
          cat > notes.md <<'EOF'
          Unsigned IPA of the Counter-Strike 1.6 iOS port (Xash3D FWGS + cs16-client + ReGameDLL_CS + YaPB bots).

          **Install** with Sideloadly, AltStore or TrollStore. On first launch, tap **Choose Game Files** and pick
          zips of your own `valve` and `cstrike` folders; the app unpacks them and starts. Full steps in the README.

          The game's maps, models, sounds and textures are not included: you need your own copy of Counter-Strike 1.6.
          EOF
          gh release create "$TAG" dist/CS16-iOS.ipa -R "$REPO" --target "${{ github.sha }}" --title "$TITLE" --notes-file notes.md
